<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #B8962E;
    --gold-light: #D4AF5A;
    --gold-pale: #F5EDD5;
    --gold-faint: #FAF6EC;
    --ink: #1A1610;
    --ink-mid: #3D3525;
    --ink-soft: #6B5E42;
    --ink-pale: #9C8E72;
    --parchment: #F7F2E8;
    --parchment-dark: #EDE5D0;
    --sand: #E8DFC8;
    --crimson: #7A2020;
    --crimson-light: #A33030;
    --teal-deep: #1A4A3E;
    --teal-mid: #266655;
    --border: rgba(184,150,46,0.25);
    --border-strong: rgba(184,150,46,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--parchment); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; font-weight: 300; line-height: 1.8; }

  /* ── HERO ── */
  .hero { background: var(--ink); color: var(--gold-pale); padding: 80px 40px 64px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(184,150,46,0.06) 39px, rgba(184,150,46,0.06) 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(184,150,46,0.06) 39px, rgba(184,150,46,0.06) 40px); }
  .hero-label { font-family: 'IM Fell English', serif; font-size: 13px; letter-spacing: 0.3em; color: var(--gold); margin-bottom: 20px; opacity: 0.9; }
  .hero-name { font-family: 'Noto Serif TC', serif; font-size: clamp(48px, 8vw, 80px); font-weight: 300; letter-spacing: 0.15em; color: #fff; line-height: 1.1; margin-bottom: 8px; }
  .hero-name-en { font-family: 'IM Fell English', serif; font-size: 18px; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 32px; display: block; }
  .hero-slogan { font-family: 'Noto Serif TC', serif; font-size: clamp(14px, 2.2vw, 17px); font-weight: 300; color: var(--sand); max-width: 640px; margin: 0 auto 40px; line-height: 1.9; font-style: italic; }
  .hero-meta { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
  .hero-meta-item { text-align: center; }
  .hero-meta-label { font-size: 11px; letter-spacing: 0.2em; color: var(--ink-pale); display: block; margin-bottom: 4px; }
  .hero-meta-value { font-size: 14px; color: var(--gold-light); font-weight: 400; }
  .hero-divider { width: 60px; height: 1px; background: var(--gold); margin: 40px auto 0; opacity: 0.5; }

  /* ── NAV ── */
  .nav { background: var(--ink-mid); padding: 0 40px; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; z-index: 100; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { color: var(--ink-pale); text-decoration: none; font-size: 12px; letter-spacing: 0.1em; padding: 14px 18px; border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.2s, border-color 0.2s; }
  .nav a:hover { color: var(--gold-light); border-bottom-color: var(--gold); }
  .nav a.nav-home { color: var(--gold-light); border-right: 1px solid rgba(184,150,46,0.25); margin-right: 6px; }
  .nav a.nav-home:hover { background: rgba(184,150,46,0.12); border-bottom-color: transparent; }

  /* ── LAYOUT ── */
  .container { max-width: 860px; margin: 0 auto; padding: 0 32px; }

  /* ── SECTION ── */
  .section { padding: 64px 0 48px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 36px; }
  .section-roman { font-family: 'IM Fell English', serif; font-size: 13px; color: var(--gold); letter-spacing: 0.15em; min-width: 28px; }
  .section-title { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 500; color: var(--ink); letter-spacing: 0.05em; }
  .section-subtitle { font-size: 12px; color: var(--ink-pale); letter-spacing: 0.1em; margin-left: auto; }
  .section-epigraph { font-family: 'Noto Serif TC', serif; font-size: 13px; color: var(--ink-soft); font-style: italic; border-left: 2px solid var(--gold); padding-left: 16px; margin-bottom: 28px; line-height: 1.7; }
  p { font-size: 15px; color: var(--ink-mid); line-height: 1.95; margin-bottom: 16px; }
  p:last-child { margin-bottom: 0; }

  /* ── INFO GRID ── */
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 32px; }
  .info-cell { background: var(--parchment); padding: 16px 20px; }
  .info-cell-label { font-size: 11px; letter-spacing: 0.15em; color: var(--gold); display: block; margin-bottom: 5px; }
  .info-cell-value { font-size: 14px; color: var(--ink-mid); font-weight: 400; line-height: 1.5; }

  /* ── TIMELINE ── */
  .timeline { position: relative; padding-left: 32px; }
  .timeline::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 1px; background: var(--border-strong); }
  .timeline-item { position: relative; margin-bottom: 36px; }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-dot { position: absolute; left: -28px; top: 8px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--gold); background: var(--parchment); }
  .timeline-dot.major { background: var(--gold); }
  .timeline-dot.dark { background: var(--crimson); border-color: var(--crimson); }
  .timeline-dot.final { background: var(--ink-soft); border-color: var(--ink-soft); }
  .timeline-badge { display: inline-block; font-size: 10px; letter-spacing: 0.12em; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; font-weight: 400; }
  .badge-major { background: #F5EDD5; color: var(--gold); border: 1px solid rgba(184,150,46,0.3); }
  .badge-dark { background: #FAF0F0; color: var(--crimson); border: 1px solid rgba(122,32,32,0.2); }
  .badge-normal { background: var(--parchment-dark); color: var(--ink-soft); border: 1px solid var(--border); }
  .timeline-title { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 500; color: var(--ink); margin-bottom: 8px; letter-spacing: 0.03em; }
  .timeline-body { font-size: 14px; color: var(--ink-soft); line-height: 1.9; margin-bottom: 10px; }
  .timeline-ref { font-size: 12px; color: var(--gold); font-style: italic; }

  /* ── SOUL GRID ── */
  .soul-grid { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 32px; }
  .soul-row { background: var(--parchment); padding: 18px 24px; display: flex; gap: 16px; align-items: flex-start; }
  .soul-icon { font-size: 18px; min-width: 28px; padding-top: 2px; }
  .soul-label { font-size: 12px; letter-spacing: 0.1em; color: var(--gold); display: block; margin-bottom: 4px; }
  .soul-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
  .soul-body { font-size: 13.5px; color: var(--ink-soft); line-height: 1.85; }

  /* ── MBTI ── */
  .mbti-card { background: var(--ink); color: var(--gold-pale); border-radius: 10px; padding: 28px 32px; margin-bottom: 24px; }
  .mbti-type { font-family: 'IM Fell English', serif; font-size: 36px; color: var(--gold); letter-spacing: 0.15em; display: block; margin-bottom: 4px; }
  .mbti-name { font-size: 13px; color: var(--sand); margin-bottom: 8px; }
  .mbti-slogan { font-size: 14px; color: var(--ink-pale); font-style: italic; font-family: 'Noto Serif TC', serif; border-top: 1px solid rgba(184,150,46,0.2); padding-top: 12px; margin-top: 8px; }
  .mbti-functions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .mbti-fn { background: rgba(255,255,255,0.04); border: 1px solid rgba(184,150,46,0.15); border-radius: 8px; padding: 14px 16px; }
  .mbti-fn-label { font-size: 10px; letter-spacing: 0.15em; color: var(--ink-pale); display: block; margin-bottom: 4px; }
  .mbti-fn-code { font-size: 18px; font-family: 'IM Fell English', serif; color: var(--gold); display: block; margin-bottom: 6px; }
  .mbti-fn-body { font-size: 12.5px; color: var(--sand); line-height: 1.75; opacity: 0.85; }

  /* ── RELATIONS ── */
  .relation-list { display: flex; flex-direction: column; gap: 16px; }
  .relation-card { background: var(--parchment); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; display: grid; grid-template-columns: 120px 1fr; gap: 20px; align-items: start; }
  .relation-name-block { text-align: center; padding-top: 4px; }
  .relation-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--gold-pale); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-size: 18px; color: var(--gold); margin: 0 auto 8px; }
  .relation-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .relation-type-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--gold-faint); color: var(--gold); border: 1px solid rgba(184,150,46,0.25); margin-top: 4px; }
  .relation-label { font-size: 11px; letter-spacing: 0.1em; color: var(--gold); display: block; margin-bottom: 3px; }
  .relation-value { font-size: 13.5px; color: var(--ink-soft); line-height: 1.8; margin-bottom: 10px; }
  .relation-ref { font-size: 12px; color: var(--ink-pale); font-style: italic; }

  /* ── THEOLOGY ── */
  .verse-block { background: var(--ink-mid); color: var(--gold-pale); border-radius: 10px; padding: 28px 32px; margin-bottom: 28px; text-align: center; }
  .verse-text { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 300; line-height: 1.9; margin-bottom: 12px; }
  .verse-ref { font-size: 13px; color: var(--gold); letter-spacing: 0.1em; }
  .word-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  .word-card { background: var(--parchment); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; }
  .word-original { font-family: 'IM Fell English', serif; font-size: 28px; color: var(--gold); display: block; margin-bottom: 4px; letter-spacing: 0.05em; }
  .word-transliteration { font-size: 13px; color: var(--ink-soft); font-style: italic; margin-bottom: 12px; }
  .word-section-label { font-size: 10px; letter-spacing: 0.15em; color: var(--gold); display: block; margin-bottom: 3px; }
  .word-section-body { font-size: 13px; color: var(--ink-soft); line-height: 1.8; margin-bottom: 10px; }
  .typology-list { display: flex; flex-direction: column; gap: 12px; }
  .typology-item { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .typology-cell { background: var(--parchment); padding: 14px 16px; }
  .typology-cell.bridge { background: var(--gold-faint); }
  .typology-cell-label { font-size: 10px; letter-spacing: 0.12em; color: var(--gold); display: block; margin-bottom: 5px; }
  .typology-cell-body { font-size: 13px; color: var(--ink-soft); line-height: 1.75; }
  .theology-insight { margin-bottom: 24px; }
  .theology-insight-title { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .theology-insight-title::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  .theology-insight-body { font-size: 13.5px; color: var(--ink-soft); line-height: 1.85; margin-left: 16px; }

  /* ── MIRROR ── */
  .questions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .question-card { background: var(--parchment); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .question-num { font-family: 'IM Fell English', serif; font-size: 24px; color: var(--border-strong); display: block; margin-bottom: 8px; }
  .question-text { font-size: 13.5px; color: var(--ink-mid); line-height: 1.85; }
  .gen-table { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 28px; }
  .gen-cell { background: var(--parchment); padding: 18px 20px; }
  .gen-cell:nth-child(3) { background: var(--teal-deep); }
  .gen-label { font-size: 10px; letter-spacing: 0.12em; color: var(--gold); display: block; margin-bottom: 6px; }
  .gen-label.light { color: rgba(184,150,46,0.7); }
  .gen-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
  .gen-title.light { color: var(--gold-pale); }
  .gen-body { font-size: 13px; color: var(--ink-soft); line-height: 1.8; }
  .gen-body.light { color: var(--sand); opacity: 0.9; }

  /* ── VOICE ── */
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tag { font-size: 12px; padding: 4px 14px; border-radius: 20px; background: var(--gold-faint); color: var(--gold); border: 1px solid rgba(184,150,46,0.3); }
  .voice-prose { background: var(--parchment-dark); border-radius: 10px; padding: 28px 32px; margin-bottom: 20px; font-family: 'Noto Serif TC', serif; font-size: 15px; color: var(--ink-mid); line-height: 2.05; font-weight: 300; }
  .voice-prose p { font-family: 'Noto Serif TC', serif; font-size: 15px; }
  .memo-card { background: var(--teal-deep); color: var(--sand); border-radius: 10px; padding: 24px 28px; margin-bottom: 20px; font-size: 14px; line-height: 1.9; }
  .memo-label { font-size: 11px; letter-spacing: 0.15em; color: rgba(184,150,46,0.7); display: block; margin-bottom: 12px; }
  .memo-card p { font-size: 14px; color: var(--sand); }

  /* ── LEGACY ── */
  .legacy-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
  .legacy-item { display: flex; gap: 16px; align-items: flex-start; padding: 18px 20px; background: var(--parchment); border: 1px solid var(--border); border-radius: 8px; }
  .legacy-num { font-family: 'IM Fell English', serif; font-size: 22px; color: var(--gold); min-width: 28px; line-height: 1.3; }
  .legacy-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 5px; }
  .legacy-body { font-size: 13.5px; color: var(--ink-soft); line-height: 1.85; }
  .final-verse { text-align: center; padding: 40px 32px; background: var(--ink); border-radius: 12px; margin-bottom: 24px; }
  .final-verse-text { font-family: 'Noto Serif TC', serif; font-size: 16px; color: var(--gold-pale); line-height: 1.95; margin-bottom: 12px; }
  .final-verse-ref { font-size: 12px; color: var(--gold); letter-spacing: 0.1em; }
  .final-question { text-align: center; padding: 40px 0 20px; font-family: 'Noto Serif TC', serif; font-size: clamp(16px, 3vw, 20px); color: var(--ink-mid); line-height: 1.9; font-style: italic; max-width: 600px; margin: 0 auto; border-top: 1px solid var(--border); }

  /* ── INSIGHT BOX ── */
  .insight-box { background: var(--gold-faint); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 16px 20px; margin: 20px 0; font-family: 'Noto Serif TC', serif; font-size: 14px; color: var(--ink-mid); line-height: 1.85; font-style: italic; }

  /* ── QUIZ ── */
  .quiz-section { max-width: 860px; margin: 0 auto; padding: 56px 32px 64px; border-top: 2px solid var(--gold); }
  .quiz-label { font-family: 'IM Fell English', serif; font-size: 12px; letter-spacing: 0.25em; color: var(--gold); display: block; margin-bottom: 12px; }
  .quiz-title { font-family: 'Noto Serif TC', serif; font-size: 21px; color: var(--ink); margin-bottom: 10px; }
  .quiz-desc { font-size: 13px; color: var(--ink-pale); line-height: 1.85; margin-bottom: 22px; }
  .quiz-btn { background: var(--ink); color: var(--gold-light); border: 1px solid var(--gold); border-radius: 30px; padding: 12px 30px; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .quiz-btn:hover { background: var(--gold); color: var(--ink); }
  .quiz-btn.secondary { background: transparent; color: var(--ink-soft); border-color: var(--border-strong); }
  .quiz-btn.secondary:hover { background: var(--gold-faint); color: var(--ink); }
  .quiz-progress-bar { display: flex; gap: 4px; margin-bottom: 24px; }
  .quiz-progress-dot { flex: 1; height: 5px; border-radius: 3px; background: var(--gold-pale); transition: background 0.2s; }
  .quiz-progress-dot.done { background: var(--gold); }
  .quiz-progress-dot.current { background: var(--gold-light); }
  .quiz-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .quiz-q-num { font-family: 'IM Fell English', serif; font-size: 13px; color: var(--gold-light); letter-spacing: 0.05em; }
  .quiz-timer { font-family: 'IM Fell English', serif; font-size: 15px; color: var(--ink-pale); }
  .quiz-timer.low { color: var(--crimson); }
  .quiz-category-badge { display: inline-block; font-size: 10.5px; letter-spacing: 0.05em; padding: 3px 12px; border-radius: 20px; background: var(--gold-faint); color: var(--gold); border: 1px solid rgba(184,150,46,0.3); margin-bottom: 14px; }
  .quiz-question { font-family: 'Noto Serif TC', serif; font-size: 16.5px; color: var(--ink); line-height: 1.85; margin-bottom: 22px; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .quiz-option { text-align: left; background: var(--parchment); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; font-size: 14px; color: var(--ink-mid); cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif; }
  .quiz-option:hover:not(.locked) { border-color: var(--gold); }
  .quiz-option.selected { border-color: var(--gold); background: var(--gold-faint); }
  .quiz-option.correct { border-color: var(--teal-deep); background: rgba(26,74,62,0.1); }
  .quiz-option.wrong { border-color: var(--crimson); background: rgba(122,32,32,0.07); }
  .quiz-option.locked { cursor: default; }
  .quiz-explain { background: var(--gold-faint); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 14px 18px; font-size: 13.5px; color: var(--ink-mid); line-height: 1.85; margin-bottom: 20px; display: none; }
  .quiz-explain.visible { display: block; }
  .quiz-actions { display: flex; justify-content: flex-end; }
  .quiz-result-score { text-align: center; padding: 12px 0 28px; }
  .quiz-result-num { font-family: 'IM Fell English', serif; font-size: 46px; color: var(--gold); display: block; }
  .quiz-result-label { font-size: 12px; color: var(--ink-pale); letter-spacing: 0.1em; margin-top: 6px; }
  .quiz-cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .quiz-cat-card { background: var(--parchment); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; text-align: center; }
  .quiz-cat-card.mastered { border-color: var(--teal-deep); background: rgba(26,74,62,0.06); }
  .quiz-cat-card.weak { border-color: var(--crimson); background: rgba(122,32,32,0.05); }
  .quiz-cat-name { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .quiz-cat-status { font-size: 12px; font-weight: 500; color: var(--ink-pale); }
  .quiz-cat-status.mastered-text { color: var(--teal-deep); }
  .quiz-cat-status.weak-text { color: var(--crimson); }
  .quiz-next-step { background: var(--teal-deep); color: var(--sand); border-radius: 10px; padding: 22px 26px; font-size: 13.5px; line-height: 1.9; margin-bottom: 24px; }
  .quiz-next-step-label { font-size: 11px; letter-spacing: 0.15em; color: rgba(184,150,46,0.7); display: block; margin-bottom: 10px; }

  /* ── FOOTER ── */
  .footer { background: var(--ink); color: var(--ink-pale); text-align: center; padding: 28px; font-size: 12px; letter-spacing: 0.1em; }
  .footer span { color: var(--gold); }

  @media (max-width: 600px) {
    .hero { padding: 56px 24px 48px; }
    .container { padding: 0 20px; }
    .section { padding: 48px 0 36px; }
    .mbti-functions { grid-template-columns: 1fr; }
    .word-cards { grid-template-columns: 1fr; }
    .questions-grid { grid-template-columns: 1fr; }
    .gen-table { grid-template-columns: 1fr; }
    .typology-item { grid-template-columns: 1fr; }
    .relation-card { grid-template-columns: 1fr; }
    .quiz-section { padding: 40px 20px 48px; }
    .relation-name-block { text-align: left; display: flex; align-items: center; gap: 12px; }
    .relation-avatar { margin: 0; }
    .hero-meta { gap: 20px; }
    .nav { padding: 0 16px; }
  }
</style>
</head>
