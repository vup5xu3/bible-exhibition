<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PORTRAIT 聖經人物深度研究 — 以八大維度剖析聖經人物的歷史、性格、神學意義與當代應用。">
<title>PORTRAIT · 聖經人物深度研究</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">

<!-- 靜態人物資料（由 _build/make_static_data.py 產生，見該檔說明如何新增/修改人物） -->
<script src="data.js"></script>

<style>
  :root {
    --gold: #B8962E; --gold-light: #D4AF5A; --gold-pale: #F5EDD5; --gold-faint: #FAF6EC;
    --ink: #1A1610; --ink-mid: #3D3525; --ink-soft: #6B5E42; --ink-pale: #9C8E72;
    --parchment: #F7F2E8; --parchment-dark: #EDE5D0; --sand: #E8DFC8; --teal-deep: #1A4A3E;
    --border: rgba(184,150,46,0.25); --border-strong: rgba(184,150,46,0.5); --danger: #9a2e2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--parchment); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; font-weight: 300; line-height: 1.8; min-height: 100vh; }

  /* ── HERO ── */
  .hero { background: var(--ink); padding: 72px 24px 56px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(184,150,46,0.05) 39px, rgba(184,150,46,0.05) 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(184,150,46,0.05) 39px, rgba(184,150,46,0.05) 40px); pointer-events: none; }
  .hero-eyebrow { font-family: 'IM Fell English', serif; font-size: 12px; letter-spacing: 0.35em; color: var(--gold); margin-bottom: 20px; opacity: 0.85; }
  .hero-title { font-family: 'IM Fell English', serif; font-size: clamp(40px, 9vw, 80px); color: #fff; letter-spacing: 0.08em; line-height: 1.05; margin-bottom: 6px; }
  .hero-title-zh { font-family: 'Noto Serif TC', serif; font-size: clamp(13px, 2.5vw, 17px); font-weight: 300; color: var(--gold-light); letter-spacing: 0.25em; margin-bottom: 28px; }
  .hero-desc { font-family: 'Noto Serif TC', serif; font-size: clamp(13px, 2vw, 15px); color: var(--sand); max-width: 560px; margin: 0 auto 36px; line-height: 2; opacity: 0.85; }
  .hero-stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
  .hero-stat { text-align: center; }
  .hero-stat-num { font-family: 'IM Fell English', serif; font-size: 28px; color: var(--gold); display: block; line-height: 1; margin-bottom: 4px; }
  .hero-stat-label { font-size: 11px; letter-spacing: 0.15em; color: var(--ink-pale); }
  .hero-divider { width: 40px; height: 1px; background: var(--gold); margin: 36px auto 0; opacity: 0.4; }

  /* ── PRIMARY TABS ── */
  .filter-wrap { background: var(--ink-mid); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); display: flex; justify-content: space-between; align-items: center; padding-right: 16px; }
  .filter-primary { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 16px; flex: 1; }
  .filter-primary::-webkit-scrollbar { display: none; }
  .tab-btn { flex-shrink: 0; background: none; border: none; color: var(--ink-pale); font-family: 'Noto Sans TC', sans-serif; font-size: 12px; font-weight: 300; letter-spacing: 0.1em; padding: 14px 16px; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
  .tab-btn:hover { color: var(--gold-light); }
  .tab-btn.active { color: var(--gold-light); border-bottom-color: var(--gold); }
  .tab-btn .tab-n { font-family: 'IM Fell English', serif; font-size: 10px; opacity: 0.55; margin-left: 5px; }

  /* ── SUB FILTER BAR ── */
  .subfilter-wrap { background: #2D271B; border-top: 1px solid rgba(184,150,46,0.12); position: sticky; top: 43px; z-index: 99; }
  .subfilter-row { display: flex; align-items: center; gap: 10px; padding: 9px 16px; flex-wrap: wrap; }
  .tier-group { display: flex; gap: 4px; flex-shrink: 0; }
  .tier-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(184,150,46,0.2); border-radius: 20px; color: var(--ink-pale); font-family: 'Noto Sans TC', sans-serif; font-size: 12px; padding: 4px 14px; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .tier-btn:hover { color: var(--gold-light); border-color: var(--gold); }
  .tier-btn.active { background: rgba(184,150,46,0.18); border-color: var(--gold); color: var(--gold-light); }

  .mbti-toggle { background: rgba(255,255,255,0.05); border: 1px solid rgba(184,150,46,0.2); border-radius: 20px; color: var(--ink-pale); font-family: 'Noto Sans TC', sans-serif; font-size: 12px; padding: 4px 14px; cursor: pointer; transition: all 0.18s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .mbti-toggle:hover { color: var(--gold-light); border-color: var(--gold); }
  .mbti-toggle.has-filter { background: rgba(184,150,46,0.18); border-color: var(--gold); color: var(--gold-light); }
  .mbti-badge { background: var(--gold); color: var(--ink); border-radius: 10px; font-size: 10px; font-weight: 500; padding: 0 6px; line-height: 15px; }
  .mbti-caret { transition: transform 0.2s; font-size: 9px; }
  .mbti-toggle.open .mbti-caret { transform: rotate(180deg); }

  .search-box { position: relative; flex: 1; min-width: 170px; max-width: 300px; margin-left: auto; }
  .search-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(184,150,46,0.2); border-radius: 20px; color: var(--sand); font-family: 'Noto Sans TC', sans-serif; font-size: 12px; font-weight: 300; padding: 5px 30px 5px 14px; outline: none; transition: border-color 0.18s; }
  .search-input::placeholder { color: rgba(156,142,114,0.75); }
  .search-input:focus { border-color: var(--gold); }
  .search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--ink-pale); font-size: 15px; cursor: pointer; padding: 0 7px; line-height: 1; display: none; }
  .search-clear.visible { display: block; }
  .search-clear:hover { color: var(--gold-light); }

  /* ── MBTI PANEL ── */
  .mbti-panel { display: none; padding: 4px 16px 16px; border-top: 1px dashed rgba(184,150,46,0.15); }
  .mbti-panel.open { display: block; }
  .mbti-panel-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 10px; gap: 12px; }
  .mbti-panel-head span { font-size: 11px; letter-spacing: 0.18em; color: var(--ink-pale); }
  .mbti-reset { background: none; border: none; color: var(--gold); font-family: 'Noto Sans TC', sans-serif; font-size: 11px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .mbti-reset:hover { color: var(--gold-light); }

  .mbti-axes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 20px; margin-bottom: 6px; }
  .mbti-axis { display: flex; align-items: center; gap: 9px; }
  .axis-label { font-size: 11px; color: var(--ink-pale); letter-spacing: 0.1em; width: 30px; flex-shrink: 0; }
  .axis-btns { display: flex; gap: 4px; }
  .axis-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(184,150,46,0.18); border-radius: 5px; color: var(--ink-pale); font-family: 'Noto Sans TC', sans-serif; font-size: 11.5px; padding: 3px 11px; cursor: pointer; transition: all 0.16s; white-space: nowrap; }
  .axis-btn b { font-family: 'IM Fell English', serif; font-size: 13px; margin-right: 3px; }
  .axis-btn:hover { color: var(--gold-light); border-color: var(--gold); }
  .axis-btn.active { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 400; }

  .mbti-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 10px 20px; }
  .mbti-group-title { font-size: 10.5px; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 6px; }
  .mbti-group-title b { color: var(--gold); font-family: 'IM Fell English', serif; font-size: 11px; letter-spacing: 0.05em; }
  .mbti-group-pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .mbti-pill { background: rgba(255,255,255,0.05); border: 1px solid rgba(184,150,46,0.2); border-radius: 20px; color: var(--ink-pale); font-family: 'IM Fell English', serif; font-size: 12px; letter-spacing: 0.05em; padding: 3px 12px; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .mbti-pill:hover { color: var(--gold-light); border-color: var(--gold); }
  .mbti-pill.active { background: rgba(184,150,46,0.2); border-color: var(--gold); color: var(--gold-light); }
  .mbti-pill.dimmed { opacity: 0.25; }
  .mbti-pill .pill-n { font-family: 'Noto Sans TC', sans-serif; font-size: 9.5px; opacity: 0.6; margin-left: 3px; }

  /* ── MAIN CONTENT ── */
  .main { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
  .section-label { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .section-label-text { font-family: 'Noto Serif TC', serif; font-size: 13px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.1em; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-count { font-family: 'IM Fell English', serif; font-size: 12px; color: var(--gold); letter-spacing: 0.05em; }
  .active-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .active-chips:empty { margin-bottom: 0; }
  .active-chip { font-size: 11px; padding: 2px 10px; border-radius: 20px; background: var(--gold-pale); border: 1px solid var(--border-strong); color: var(--ink-soft); display: flex; align-items: center; gap: 5px; }
  .active-chip button { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
  .active-chip button:hover { color: var(--danger); }

  /* ── CARDS GRID ── */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .char-card-wrap { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; }
  .char-card-wrap:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(26,22,16,0.1); border-color: var(--border-strong); }
  .char-card { padding: 22px 22px 18px; text-decoration: none; color: inherit; display: block; flex: 1; position: relative; }
  .char-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); transform: scaleX(0); transform-origin: left; transition: transform 0.25s; }
  .char-card-wrap:hover .char-card::before { transform: scaleX(1); }
  .char-card-wrap.is-major { border-color: var(--border-strong); }

  .char-card-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
  .char-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--gold-pale); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-size: 18px; color: var(--gold); flex-shrink: 0; }
  .char-name-block { flex: 1; min-width: 0; }
  .char-name { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 500; color: var(--ink); margin-bottom: 3px; letter-spacing: 0.03em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.4; }
  .char-epithet { font-family: 'Noto Sans TC', sans-serif; font-size: 11px; font-weight: 300; color: var(--ink-soft); background: var(--gold-faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; letter-spacing: 0.02em; }
  .char-star { color: var(--gold); font-size: 12px; }
  .char-name-en { font-family: 'IM Fell English', serif; font-size: 12px; color: var(--ink-pale); letter-spacing: 0.08em; }
  .char-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.85; margin-bottom: 14px; }
  .char-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .char-tag { font-size: 10px; letter-spacing: 0.1em; padding: 2px 9px; border-radius: 20px; border: 1px solid rgba(184,150,46,0.25); color: var(--gold); background: var(--gold-faint); }
  .char-tag.mbti { background: rgba(26,74,62,0.07); border-color: rgba(26,74,62,0.25); color: var(--teal-deep); font-family: 'IM Fell English', serif; letter-spacing: 0.05em; }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--ink-pale); display: none; }
  .empty-state.visible { display: block; }
  .empty-state-icon { font-family: 'IM Fell English', serif; font-size: 48px; color: var(--border-strong); display: block; margin-bottom: 16px; }
  .tab-notice { background: var(--teal-deep); border-radius: 12px; padding: 32px 28px; color: var(--sand); text-align: center; display: none; margin-bottom: 24px; }
  .tab-notice.visible { display: block; }
  .tab-notice h3 { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 400; color: var(--gold-light); margin-bottom: 10px; letter-spacing: 0.05em; }
  .tab-notice p { font-size: 14px; color: var(--sand); opacity: 0.8; line-height: 1.9; }
  .footer { background: var(--ink); color: var(--ink-pale); text-align: center; padding: 28px; font-size: 11px; letter-spacing: 0.12em; }
  .footer span { color: var(--gold); }

  @media (max-width: 640px) {
    .subfilter-wrap { position: static; }
    .search-box { max-width: none; margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-eyebrow">PORTRAIT · BIBLE CHARACTERS</div>
  <h1 class="hero-title">Portrait</h1>
  <div class="hero-title-zh">聖經人物深度研究</div>
  <p class="hero-desc">每一位聖經人物，都是神救贖計劃中的一個章節。<br>透過他們的生命，看見自己；透過自己，更理解聖經的大敘事。</p>
  <div class="hero-stats">
    <div class="hero-stat"><span class="hero-stat-num" id="stat-total">0</span><span class="hero-stat-label">人物總數</span></div>
    <div class="hero-stat"><span class="hero-stat-num">8</span><span class="hero-stat-label">研究維度</span></div>
    <div class="hero-stat"><span class="hero-stat-num">16</span><span class="hero-stat-label">MBTI 類型</span></div>
  </div>
  <div class="hero-divider"></div>
</div>

<!-- PRIMARY TABS -->
<div class="filter-wrap">
  <div class="filter-primary" id="filter-primary"></div>
</div>

<!-- SUB FILTER BAR -->
<div class="subfilter-wrap" id="subfilter-wrap">
  <div class="subfilter-row">
    <div class="tier-group" id="tier-group">
      <button class="tier-btn active" data-tier="all">全部</button>
      <button class="tier-btn" data-tier="major">★ 重要人物</button>
    </div>
    <button class="mbti-toggle" id="mbti-toggle" onclick="toggleMbtiPanel()">
      人格篩選<span class="mbti-badge" id="mbti-badge" style="display:none">0</span><span class="mbti-caret">▼</span>
    </button>
    <div class="search-box">
      <input type="search" class="search-input" id="search-input" placeholder="搜尋名字、身份、標籤、MBTI…" autocomplete="off">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">×</button>
    </div>
  </div>

  <!-- MBTI 兩層篩選面板 -->
  <div class="mbti-panel" id="mbti-panel">
    <div class="mbti-panel-head">
      <span>第一層 · 維度快篩（可任意組合，未選＝不限）</span>
      <button class="mbti-reset" onclick="resetMbti()">清除人格篩選</button>
    </div>
    <div class="mbti-axes" id="mbti-axes"></div>
    <div class="mbti-panel-head"><span>第二層 · 十六型細分（依四大氣質群組）</span></div>
    <div class="mbti-groups" id="mbti-groups"></div>
  </div>
</div>

<!-- MAIN -->
<main class="main">
  <div class="section-label">
    <span class="section-label-text" id="section-label-text">全部人物</span>
    <span class="section-count" id="section-count">— 0 人物</span>
  </div>
  <div class="tab-notice" id="tab-notice"><h3 id="notice-title"></h3><p id="notice-body"></p></div>
  <div class="active-chips" id="active-chips"></div>
  <div class="cards-grid" id="cards-grid"></div>
  <div class="empty-state" id="empty-state">
    <span class="empty-state-icon">∅</span>
    <p id="empty-text">此分類尚未收錄人物，敬請期待。</p>
  </div>
</main>

<div class="footer">PORTRAIT 聖經人物深度研究 · <span>透過人物，理解聖經大敘事</span></div>

<script>
// ══════════════════════════════════════════
// 人物資料：來自 data.js 內定義的 window.BIBLE_CHARACTERS（靜態陣列，無需網路請求）。
// 要新增／修改人物，請見 _build/make_static_data.py 的說明。
// ══════════════════════════════════════════
const CHARACTERS = (window.BIBLE_CHARACTERS || []).map(d => ({
  id: d.id, name: d.name, nameEn: d.name_en, avatar: d.avatar,
  desc: d.description, mbti: d.mbti, file: d.file_name,
  categories: d.categories || [], tags: d.tags || [], sort_order: d.sort_order,
  epithet: d.epithet || "", tier: d.tier || "normal"
}));

// ── 分類定義（單一資料來源：頁籤由此產生）──
const TABS = [
  { key: "all",       label: "全部人物",              people: true, notice: null },
  { key: "ot",        label: "舊約人物",              people: true, notice: null },
  { key: "nt",        label: "新約人物",              people: true, notice: null },
  { key: "apostle",   label: "十二使徒與末後首位使徒", people: true,
    notice: { t: "十二使徒與末後首位使徒",
              b: "主親自揀選的十二人，加上後來被選補的馬提亞與外邦使徒保羅——<br>以及在這末後的世代，被主同樣呼召差遣的首位使徒。" } },
  { key: "genealogy", label: "主耶穌家譜",            people: true,
    notice: { t: "主耶穌家譜 · 馬太福音 1 章",
              b: "從亞伯拉罕到大衛，從大衛到被擄巴比倫，從被擄到基督降生——<br>家譜不只是名單，而是神在歷史中守約的見證。" } },
  { key: "mbti",      label: "MBTI 人格圖譜",         people: true,
    notice: { t: "MBTI 人格圖譜",
              b: "所有已完成人格推導的人物皆自動收錄於此。<br>用上方「人格篩選」先挑維度（想看 I 人、想看 J 人），或直接點選十六型細分。" } },
  { key: "study",     label: "專題研究",              people: false, notice: null },
];

const AXES = [
  { key: "EI", label: "傾向", opts: [["I", "內向"], ["E", "外向"]] },
  { key: "NS", label: "訊息", opts: [["N", "直覺"], ["S", "實感"]] },
  { key: "TF", label: "決策", opts: [["T", "思考"], ["F", "情感"]] },
  { key: "JP", label: "生活", opts: [["J", "判斷"], ["P", "感知"]] },
];
const MBTI_GROUPS = [
  { code: "NT", name: "分析家", types: ["INTJ", "INTP", "ENTJ", "ENTP"] },
  { code: "NF", name: "外交家", types: ["INFJ", "INFP", "ENFJ", "ENFP"] },
  { code: "SJ", name: "守衛者", types: ["ISTJ", "ISFJ", "ESTJ", "ESFJ"] },
  { code: "SP", name: "探險家", types: ["ISTP", "ISFP", "ESTP", "ESFP"] },
];

let currentTab = "all";
let currentTier = "all";
let searchTerm = "";
let mbtiFilter = { EI: null, NS: null, TF: null, JP: null };

window.addEventListener("DOMContentLoaded", () => {
  buildTabs(); buildMbtiPanel(); bindControls();
  renderCards();
});

// ── 動態建構 UI 骨架 ──
function buildTabs() {
  document.getElementById("filter-primary").innerHTML = TABS.map(t =>
    `<button class="tab-btn${t.key === currentTab ? " active" : ""}" data-tab="${t.key}">${t.label}<span class="tab-n" id="tabn-${t.key}"></span></button>`
  ).join("");
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.dataset.tab;
      renderCards();
    });
  });
}

function buildMbtiPanel() {
  document.getElementById("mbti-axes").innerHTML = AXES.map(ax => `
    <div class="mbti-axis">
      <span class="axis-label">${ax.label}</span>
      <div class="axis-btns">
        ${ax.opts.map(([L, zh]) => `<button class="axis-btn" data-axis="${ax.key}" data-letter="${L}"><b>${L}</b>${zh}</button>`).join("")}
      </div>
    </div>`).join("");

  document.getElementById("mbti-groups").innerHTML = MBTI_GROUPS.map(g => `
    <div class="mbti-group">
      <div class="mbti-group-title"><b>${g.code}</b> ${g.name}</div>
      <div class="mbti-group-pills">
        ${g.types.map(t => `<button class="mbti-pill" data-mbti="${t}">${t}<span class="pill-n" id="pilln-${t}"></span></button>`).join("")}
      </div>
    </div>`).join("");
}

function bindControls() {
  // 第一層：維度快篩（同軸再點一次即取消）
  document.querySelectorAll(".axis-btn").forEach(b => b.addEventListener("click", () => {
    const axis = b.dataset.axis, letter = b.dataset.letter;
    mbtiFilter[axis] = mbtiFilter[axis] === letter ? null : letter;
    syncMbtiUI(); renderCards();
  }));

  // 第二層：十六型細分（一次設定四個軸；再點一次全部清除）
  document.querySelectorAll(".mbti-pill").forEach(p => p.addEventListener("click", () => {
    const t = p.dataset.mbti;
    if (currentMbtiType() === t) { resetMbti(); return; }
    mbtiFilter = { EI: t[0], NS: t[1], TF: t[2], JP: t[3] };
    syncMbtiUI(); renderCards();
  }));

  document.querySelectorAll(".tier-btn").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tier-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active"); currentTier = b.dataset.tier; renderCards();
  }));

  const si = document.getElementById("search-input");
  si.addEventListener("input", () => {
    searchTerm = si.value.trim().toLowerCase();
    document.getElementById("search-clear").classList.toggle("visible", si.value !== "");
    renderCards();
  });
}

// 目前四軸是否恰好構成一個完整的 MBTI 類型
function currentMbtiType() {
  const f = mbtiFilter;
  return (f.EI && f.NS && f.TF && f.JP) ? f.EI + f.NS + f.TF + f.JP : null;
}
function activeAxisCount() { return AXES.filter(a => mbtiFilter[a.key]).length; }

function toggleMbtiPanel() {
  document.getElementById("mbti-panel").classList.toggle("open");
  document.getElementById("mbti-toggle").classList.toggle("open");
}
function resetMbti() { mbtiFilter = { EI: null, NS: null, TF: null, JP: null }; syncMbtiUI(); renderCards(); }
function clearSearch() {
  document.getElementById("search-input").value = ""; searchTerm = "";
  document.getElementById("search-clear").classList.remove("visible"); renderCards();
}

// 讓兩層 UI 狀態彼此同步：軸鈕高亮、型別藥丸高亮／變淡
function syncMbtiUI() {
  document.querySelectorAll(".axis-btn").forEach(b => {
    b.classList.toggle("active", mbtiFilter[b.dataset.axis] === b.dataset.letter);
  });
  const exact = currentMbtiType();
  document.querySelectorAll(".mbti-pill").forEach(p => {
    const t = p.dataset.mbti;
    p.classList.toggle("active", exact === t);
    // 不符合目前維度快篩的型別淡化，讓「I 人有哪幾型」一眼看得出來
    p.classList.toggle("dimmed", !exact && activeAxisCount() > 0 && !matchesAxes(t));
  });
  const n = activeAxisCount();
  const badge = document.getElementById("mbti-badge");
  badge.style.display = n ? "inline-block" : "none";
  badge.textContent = exact ? exact : n;
  document.getElementById("mbti-toggle").classList.toggle("has-filter", n > 0);
}

function matchesAxes(type) {
  if (!type) return false;
  return AXES.every((ax, i) => !mbtiFilter[ax.key] || type[i] === mbtiFilter[ax.key]);
}

// ── 篩選核心 ──
function inTab(c, tab) {
  if (tab === "all")  return !c.categories.includes("study");
  if (tab === "mbti") return !!c.mbti;   // 有推導出人格就自動收錄，不需另外打標籤
  return c.categories.includes(tab);
}
function matchesSearch(c) {
  if (!searchTerm) return true;
  return [c.name, c.epithet, c.nameEn, c.desc, c.mbti].concat(c.tags || [])
    .filter(Boolean).join(" ").toLowerCase().includes(searchTerm);
}
function applyFilters(tab) {
  return CHARACTERS.filter(c =>
    inTab(c, tab) &&
    (currentTier === "all" || c.tier === currentTier) &&
    (activeAxisCount() === 0 || matchesAxes(c.mbti)) &&
    matchesSearch(c)
  );
}

function renderCards() {
  const grid   = document.getElementById("cards-grid");
  const empty  = document.getElementById("empty-state");
  const notice = document.getElementById("tab-notice");
  const tabDef = TABS.find(t => t.key === currentTab);

  grid.innerHTML = ""; empty.classList.remove("visible"); notice.classList.remove("visible");
  grid.style.display = "grid";
  document.getElementById("section-label-text").textContent = tabDef.label;

  // 專題研究不是人物，隱藏重要度與人格篩選
  document.getElementById("subfilter-wrap").style.display = tabDef.people ? "block" : "none";

  if (tabDef.notice) {
    document.getElementById("notice-title").textContent = tabDef.notice.t;
    document.getElementById("notice-body").innerHTML = tabDef.notice.b;
    notice.classList.add("visible");
  }

  const filtered = applyFilters(currentTab);
  document.getElementById("section-count").textContent = `— ${filtered.length} 人物`;
  document.getElementById("stat-total").textContent =
    CHARACTERS.filter(c => !c.categories.includes("study")).length;

  updateTabCounts(); updatePillCounts(); renderActiveChips();

  if (filtered.length === 0) {
    grid.style.display = "none";
    document.getElementById("empty-text").textContent =
      (currentTier !== "all" || activeAxisCount() || searchTerm)
        ? "沒有符合目前篩選條件的人物，試著放寬條件。"
        : "此分類尚未收錄人物，敬請期待。";
    empty.classList.add("visible");
    return;
  }

  filtered.forEach(c => {
    const wrap = document.createElement("div");
    wrap.className = "char-card-wrap" + (c.tier === "major" ? " is-major" : "");

    const card = document.createElement("a");
    card.className = "char-card"; card.href = c.file;

    const tagsHTML = (c.tags || []).map(t => `<span class="char-tag">${esc(t)}</span>`).join("");
    const mbtiTag  = c.mbti ? `<span class="char-tag mbti">${esc(c.mbti)}</span>` : "";
    const epithet  = c.epithet ? `<span class="char-epithet">${esc(c.epithet)}</span>` : "";
    const star     = c.tier === "major" ? `<span class="char-star" title="重要人物">★</span>` : "";

    card.innerHTML = `
      <div class="char-card-top">
        <div class="char-avatar">${esc(c.avatar)}</div>
        <div class="char-name-block">
          <div class="char-name">${esc(c.name)}${epithet}${star}</div>
          <div class="char-name-en">${esc(c.nameEn)}</div>
        </div>
      </div>
      <div class="char-desc">${esc(c.desc)}</div>
      <div class="char-tags">${tagsHTML}${mbtiTag}</div>`;
    wrap.appendChild(card);
    grid.appendChild(wrap);
  });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

// 每個頁籤右上角的收錄筆數
function updateTabCounts() {
  TABS.forEach(t => {
    const el = document.getElementById("tabn-" + t.key);
    if (el) el.textContent = CHARACTERS.filter(c => inTab(c, t.key)).length;
  });
}

// 十六型藥丸上的即時人數，讓「哪一型有人」一目了然
function updatePillCounts() {
  const pool = CHARACTERS.filter(c =>
    inTab(c, currentTab) && (currentTier === "all" || c.tier === currentTier));
  MBTI_GROUPS.forEach(g => g.types.forEach(t => {
    const el = document.getElementById("pilln-" + t);
    if (!el) return;
    const n = pool.filter(c => c.mbti === t).length;
    el.textContent = n ? n : "";
  }));
}

function renderActiveChips() {
  const box = document.getElementById("active-chips");
  const chips = [];
  if (currentTier === "major") chips.push(["★ 重要人物", "tier"]);
  const exact = currentMbtiType();
  if (exact) chips.push([exact, "mbti"]);
  else AXES.forEach(ax => { if (mbtiFilter[ax.key]) chips.push([ax.label + "：" + mbtiFilter[ax.key], "axis:" + ax.key]); });
  if (searchTerm) chips.push(["搜尋「" + searchTerm + "」", "search"]);

  box.innerHTML = chips.map(pair =>
    `<span class="active-chip">${esc(pair[0])}<button onclick="removeChip('${pair[1]}')" title="移除">×</button></span>`).join("");
}

function removeChip(key) {
  if (key === "tier") {
    currentTier = "all";
    document.querySelectorAll(".tier-btn").forEach(x => x.classList.toggle("active", x.dataset.tier === "all"));
  } else if (key === "search") { clearSearch(); return; }
  else if (key === "mbti") { resetMbti(); return; }
  else if (key.indexOf("axis:") === 0) { mbtiFilter[key.slice(5)] = null; syncMbtiUI(); }
  renderCards();
}
</script>
